/* ============================================================================
   1. DESIGN TOKENS
   Deep ocean navy grounds the page and clearly dominates. Warm sand/stone
   neutrals carry the light sections. Aged brass is the ONLY accent and is
   rationed — see the gold audit note in section 5.
   ========================================================================== */
:root {
  --ink:        #0B1620;
  --ink-2:      #132330;
  --ink-3:      #1D3040;

  --sand:       #EDE5D8;
  --sand-2:     #F7F3EC;

  --line-light: rgba(11, 22, 32, 0.13);
  --line-dark:  rgba(237, 229, 216, 0.15);

  --font-serif: "Didot", "Bodoni MT", "Hoefler Text", "Baskerville", Georgia, "Times New Roman", serif;
  --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* Multi-layered shadows — a tight close shadow plus soft wide ones, so cards
     read as genuinely lifted off the background rather than stamped onto it. */
  --shadow-card:
      0 1px 2px rgba(11, 22, 32, 0.05),
      0 6px 16px rgba(11, 22, 32, 0.07),
      0 22px 44px rgba(11, 22, 32, 0.09),
      0 48px 90px rgba(11, 22, 32, 0.07);
  --shadow-card-dark:
      0 1px 2px rgba(0, 0, 0, 0.28),
      0 8px 22px rgba(0, 0, 0, 0.26),
      0 28px 58px rgba(0, 0, 0, 0.30),
      0 60px 110px rgba(0, 0, 0, 0.26);
  --shadow-nav:
      0 1px 1px rgba(11, 22, 32, 0.12),
      0 10px 30px rgba(11, 22, 32, 0.18);

  /* Fine-grain noise, inline SVG — no network request. Reused everywhere
     depth is needed so backgrounds never read as one flat CSS color. */
  --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.55'/></svg>");

  /* MOTION SYSTEM — one curve, a small set of durations. Everything that moves
     on this page pulls from here so the whole thing reads as one system rather
     than a pile of per-element effects. Scale duration to the size of the thing
     moving: a nav underline is --t-quick, a whole section is --t-slow. */
  --ease:    cubic-bezier(0.22, 0.61, 0.36, 1);
  --t-quick: 200ms;   /* small UI: underlines, tab panes */
  --t-base:  320ms;   /* list items, confirmation lines */
  --t-slow:  520ms;   /* whole sections */
  --stagger: 70ms;    /* gap between siblings in a cascade */

  --maxw: 1240px;
  --gutter: clamp(20px, 5vw, 68px);
}

/* ============================================================================
   2. RESET + BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  /* clip, not hidden: `overflow-x: hidden` makes body a scroll container, which
     breaks `position: sticky` on descendants — and How It Works depends on it.
     `clip` gives the same horizontal-overflow protection without that. The
     hidden line stays first as a fallback for browsers without clip. */

/* ============================================================================

   Each section gets a soft directional gradient within its own tone plus a

.section {

/* ============================================================================
   4. GLASS — nav and content cards only. Never a full-page background.
   ========================================================================== */
.glass {
  background: rgba(237, 229, 216, 0.09);
  -webkit-backdrop-filter: blur(20px) saturate(135%);
  backdrop-filter: blur(20px) saturate(135%);
  border: 1px solid rgba(237, 229, 216, 0.17);
  border-radius: 3px;
  box-shadow: var(--shadow-card-dark);
}
.glass-light {
  background: rgba(255, 255, 255, 0.52);
  -webkit-backdrop-filter: blur(20px) saturate(135%);

  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: 3px;
  box-shadow: var(--shadow-card);
}
/* Top highlight edge — sells the "pane of glass" read. */
.glass::before, .glass-light::before {
  content: ""; position: absolute; top: 0; left: 12px; right: 12px; height: 1px;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);

   motion (initCardGlow gates the listeners on the same conditions). A soft

   because it stays quiet at any card size and costs one background repaint
   instead of a transform on a backdrop-filtered element. */

  .glass::after, .glass-light::after {
    content: ""; position: absolute; inset: 0; z-index: 0;
    border-radius: inherit; pointer-events: none;
    opacity: 0; transition: opacity 340ms ease;

  }
  .glass:hover::after, .glass-light:hover::after { opacity: 1; }
  /* The waitlist card is a form — a highlight chasing the cursor across the
     inputs while someone is filling them in is noise, not polish. */
  .form-shell::after { content: none; }

  .track { transition: transform 420ms var(--ease), box-shadow 420ms ease; }
  .track:hover { transform: translateY(-3px); }
}
/* Lift card contents above the glow layer so the highlight never washes over
   text. Direct children only — cheap, and enough. */
.glass > *, .glass-light > * { position: relative; z-index: 1; }

/* ============================================================================

   ========================================================================== */
.nav {

  content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 1px;

@media (min-width: 940px) { .nav__links { display: flex; } }

/* Nav actions. "Get in Touch" is deliberately the quieter of the two: it picks

.nav__actions { display: flex; align-items: center; gap: 10px; }
.btn--ghost {

  color: rgba(237, 229, 216, 0.80);

  backdrop-filter: blur(10px) saturate(130%);
}

  color: var(--sand);
  background: rgba(237, 229, 216, 0.11);
  transform: translateY(-1px);
}

@media (min-width: 600px) { .nav__secondary { display: inline-flex; } }

/* ============================================================================
   7. IMAGE / VIDEO SLOTS
   Composed while empty: correct aspect ratio, palette-matched tone, inset
   frame line and a soft light sweep so they read as placed art, not gaps.
   ========================================================================== */
.slot {
  position: relative; margin: 0; overflow: hidden;
  border-radius: 3px; isolation: isolate;
  background: linear-gradient(158deg, #1B2E3C 0%, #101F2B 52%, #0A141C 100%);
  box-shadow: var(--shadow-card-dark);
}
.slot--light {
  background: linear-gradient(158deg, #E9E0D0 0%, #DFD3BF 55%, #D2C4AC 100%);
  box-shadow: var(--shadow-card);
}
/* Light sweep + grain: makes an empty slot feel like an unexposed photograph. */
.slot::before {
  content: ""; position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(66% 54% at 72% 12%, rgba(201, 164, 101, 0.20) 0%, rgba(201, 164, 101, 0) 62%),
    radial-gradient(78% 60% at 8% 100%, rgba(237, 229, 216, 0.12) 0%, rgba(237, 229, 216, 0) 58%);
}
.slot--light::before {
  background:
    radial-gradient(66% 54% at 74% 10%, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 62%),
    radial-gradient(70% 56% at 6% 100%, rgba(11, 22, 32, 0.10) 0%, rgba(11, 22, 32, 0) 58%);
}
.slot::after {
  content: ""; position: absolute; inset: 0; z-index: 2;
  background-image: var(--noise); opacity: 0.09; pointer-events: none;
}
.slot__frame {
  position: absolute; inset: 16px; z-index: 3;
  border: 1px solid rgba(237, 229, 216, 0.13); pointer-events: none;
}
.slot--light .slot__frame { border-color: rgba(11, 22, 32, 0.10); }
.slot__meta {
  position: absolute; left: 30px; bottom: 26px; z-index: 4;
  font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(237, 229, 216, 0.42); line-height: 1.8;
}
.slot--light .slot__meta { color: rgba(11, 22, 32, 0.34); }
.slot__meta b { display: block; font-weight: 600; color: rgba(237, 229, 216, 0.62); }
.slot--light .slot__meta b { color: rgba(11, 22, 32, 0.5); }
/* Oversized on purpose: the extra 9% top/bottom is the headroom the parallax
   drift moves within, so the frame never exposes an edge mid-scroll. */
.slot__media {
  position: absolute; left: 0; z-index: 1;
  top: -9%; width: 100%; height: 118%;
  object-fit: cover;
  transform-origin: center center;
  backface-visibility: hidden;
  will-change: transform;
}
.slot.is-filled::before, .slot.is-filled .slot__meta { display: none; }

/* ============================================================================
   8. HERO — full-bleed image slot, content offset left, floating glass card
   ========================================================================== */
.hero {
  position: relative; min-height: 100svh;
  display: flex; align-items: flex-end;
  padding: 150px 0 clamp(52px, 8vw, 104px);
  background: var(--ink); color: var(--sand);
  overflow: hidden; isolation: isolate;
}
/* Full-bleed backdrop layer for the hero image slot.
   (Slot marker lives in the JS component — CSS comments can't nest.) */
.hero__slot { position: absolute; inset: 0; z-index: 0; border-radius: 0; box-shadow: none; }
/* Headroom for the hero's wider drift range (see initParallax), but only just:
   every extra percent of height makes the box more portrait, and a 16:9 clip
   cover-fitted into a portrait box loses width fast. 10% each side against a
   9% drift is the most the composition can pay for.

   object-position is the important part. Centre-cropping this frame throws
   away both the ocean on the left and the far end of the house on the right,
   landing the headline on bright glass. Biasing to 34% keeps the dusk ocean
   and horizon behind the text column — quiet, dark, and the reason the scrim
   above can afford to be as light as it now is. */
.hero__slot .slot__media {
  top: -10%; height: 120%;
  object-position: 34% center;
}
/* Must match CONFIG.portrait.media. The portrait asset is composed for a tall
   frame — sky, house, foreground stacked — so it wants a centred crop; the 34%
   bias above exists only to rescue the landscape frame and would push this one
   off its own axis. */
@media (max-aspect-ratio: 3/4) {
  .hero__slot .slot__media { object-position: center; }
}
.hero__slot .slot__frame { inset: clamp(14px, 2.4vw, 30px); }
.hero__slot .slot__meta { left: auto; right: clamp(28px, 4vw, 54px); bottom: clamp(26px, 4vw, 44px); text-align: right; }
/* Scrim, retuned for real photography.
   The generated frame is already dark on its left third (dusk ocean and sky),
   so the heavy 0.94 wash the placeholder needed is now doing nothing but
   hiding the image. This version leans on the picture's own falloff: enough
   ink under the text column to hold contrast, then it gets out of the way so
   the architecture on the right reads at close to full strength.
   Measured against the actual asset — see the contrast check in the notes. */
.hero__scrim {
  position: absolute; inset: 0; z-index: 1;
  background:
    linear-gradient(100deg,
      rgba(6, 13, 19, 0.86) 0%,
      rgba(6, 13, 19, 0.66) 34%,
      rgba(6, 13, 19, 0.22) 68%,
      rgba(6, 13, 19, 0.34) 100%),
    linear-gradient(to top,
      rgba(6, 13, 19, 0.80) 0%,
      rgba(6, 13, 19, 0.18) 42%,
      rgba(6, 13, 19, 0) 62%);
}
/* Thin architectural line grid — restrained structure, not decoration. */
.hero__grid {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background-image:
    linear-gradient(to right,  rgba(237,229,216,0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(237,229,216,0.03) 1px, transparent 1px);
  background-size: 140px 140px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent 78%);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent 78%);
}
.hero__inner { position: relative; z-index: 3; width: 100%; }
.hero__eyebrow {
  font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
  color: rgba(237, 229, 216, 0.62); margin: 0 0 26px;
}
.hero__title { color: var(--sand); margin-bottom: 30px; }
.hero__title em {
  display: block; font-style: italic; color: rgba(237, 229, 216, 0.74);
}
.hero__sub {
  font-size: clamp(18px, 2.1vw, 22px); line-height: 1.55;
  color: rgba(237, 229, 216, 0.88); max-width: 38ch; margin-bottom: 14px;
}
.hero__note { font-size: 15px; color: rgba(237, 229, 216, 0.55); max-width: 42ch; margin-bottom: 40px; }
.hero__ctas { display: flex; flex-wrap: wrap; gap: 14px; }
/* Floating glass card, bottom-right — breaks the single-column stack. */
.hero__card { margin-top: 46px; padding: 26px 28px; }
.hero__card dl { margin: 0; display: grid; gap: 20px; }
.hero__card dt {
  font-family: var(--font-serif); font-size: 21px; color: var(--sand);
  letter-spacing: 0.01em; margin-bottom: 3px;
}

  .hero__inner { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: clamp(40px, 6vw, 96px); align-items: end; }
  .hero__card { margin-top: 0; }
}
.scroll-cue {
  position: absolute; z-index: 3; left: var(--gutter); bottom: 22px;
  font-size: 9.5px; letter-spacing: 0.26em; text-transform: uppercase;
  color: rgba(237, 229, 216, 0.34); display: none;
}
/* Idle hint so the hero is not frozen before the first scroll. 4px of drift on
   a 4.6s cycle — under the threshold where it reads as an animation, over the
   threshold where the page feels dead. ease-in-out rather than --ease: the
   shared curve is decelerate-only, which visibly stutters when looped. */
@keyframes cue-drift {
  0%, 100% { transform: translateY(0);   opacity: 0.7; }
  50%      { transform: translateY(4px); opacity: 1; }
}
.scroll-cue { animation: cue-drift 4.6s ease-in-out infinite; }
@media (min-width: 820px) and (min-height: 700px) { .scroll-cue { display: block; } }

/* ============================================================================
   8b. STAT BAR — divided segments directly under the hero.
   Structural idea taken from the architecture reference; rebuilt entirely in
   this page's own tokens (navy ground, serif value, stone label) rather than
   that site's cream-and-gold treatment. Content is real facts only.
   ========================================================================== */
.statbar {
  position: relative; z-index: 2; isolation: isolate;
  background: linear-gradient(172deg, #16273300 0%, #101E29 0%, #0C1922 100%);
  border-top: 1px solid var(--line-dark);
  border-bottom: 1px solid var(--line-dark);
}
.statbar::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: var(--noise); opacity: 0.10;
}
.statbar__inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; }
.statbar__cell {
  padding: clamp(22px, 3.2vw, 36px) clamp(14px, 2.2vw, 28px);
  border-left: 1px solid var(--line-dark);
}
/* Two-up on small screens: no left rule on the first of each row, and a
   horizontal rule between the two rows. */
.statbar__cell:nth-child(odd)  { border-left: 0; }
.statbar__cell:nth-child(n+3)  { border-top: 1px solid var(--line-dark); }
.statbar__value {
  display: block; font-family: var(--font-serif); font-weight: 400;
  font-size: clamp(18px, 2.3vw, 26px); line-height: 1.15;
  color: var(--sand); margin-bottom: 7px;
}
.statbar__label {
  font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--stone-dim);
}
@media (min-width: 860px) {
  .statbar__inner { grid-template-columns: repeat(4, 1fr); }
  .statbar__cell:nth-child(odd) { border-left: 1px solid var(--line-dark); }
  .statbar__cell:first-child    { border-left: 0; }
  .statbar__cell:nth-child(n+3) { border-top: 0; }
}

/* ============================================================================
   9. PROBLEM — a full-bleed SCENE.
   The clip fills the frame and the type sits directly on it over a scrim, the
   same technique the hero already uses. Why Oahu deliberately keeps its
   split grid so the page alternates treatments instead of repeating one.
   ========================================================================== */
.problem { --pad: 0; }
.problem > .wrap { padding-top: clamp(44px, 6vw, 74px); padding-bottom: clamp(78px, 10vw, 132px); }

.scene {
  position: relative; z-index: 1; isolation: isolate;
  min-height: min(78vh, 700px);
  display: flex; align-items: flex-end;
  padding: clamp(76px, 11vw, 140px) 0 clamp(40px, 5vw, 64px);
  overflow: hidden; background: var(--ink);
}
.problem__slot { position: absolute; inset: 0; z-index: 0; border-radius: 0; box-shadow: none; }
.problem__slot .slot__frame { inset: clamp(14px, 2.4vw, 30px); }
.scene__scrim {
  position: absolute; inset: 0; z-index: 1;
  background:
    linear-gradient(102deg, rgba(6, 13, 19, 0.93) 0%, rgba(6, 13, 19, 0.76) 44%, rgba(6, 13, 19, 0.32) 80%, rgba(6, 13, 19, 0.50) 100%),
    linear-gradient(to top, rgba(6, 13, 19, 0.88) 0%, rgba(6, 13, 19, 0) 54%);
}
.scene__inner { position: relative; z-index: 2; width: 100%; color: var(--sand); }
.scene__label { color: var(--stone-dim); }
.scene__title { color: var(--sand); }
.scene__body {
  margin-top: 20px; max-width: 54ch;
  font-size: clamp(16px, 1.8vw, 19px); line-height: 1.6;
  color: rgba(237, 229, 216, 0.82);
}
/* The quiet "learn more" the travel reference uses — a link, not a button, so
   it never competes with the brass CTAs. */
.scene__more {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 26px;
  font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--sand); text-decoration: none;
  padding-bottom: 6px; border-bottom: 1px solid rgba(237, 229, 216, 0.32);
  transition: border-color 300ms var(--ease), color 300ms var(--ease);
}
.scene__more span {
  width: 18px; height: 1px; background: currentColor; position: relative;
  transition: transform 300ms var(--ease);
}
.scene__more span::after {
  content: ""; position: absolute; right: 0; top: -3px;
  width: 7px; height: 7px; border-top: 1px solid currentColor;
  border-right: 1px solid currentColor; transform: rotate(45deg);
}
.scene__more:hover { color: var(--brass-2); border-bottom-color: var(--brass-2); }
.scene__more:hover span { transform: translateX(5px); }

.stat-card { padding: 20px 24px; max-width: 230px; margin-top: 30px; }
.stat-card b {
  display: block; font-family: var(--font-serif); font-weight: 400;
  font-size: 30px; line-height: 1.1; color: var(--ink); margin-bottom: 6px;
}
.stat-card span { font-size: 12.5px; line-height: 1.5; color: var(--stone); }
/* Floated into the scene only where there is room for it; on narrow screens it
   simply flows under the copy rather than covering the frame. */
@media (min-width: 900px) {
  .stat-card { position: absolute; right: 0; bottom: 0; margin-top: 0; z-index: 3; }
  .scene__inner { padding-right: 270px; }
}

/* Three points, side by side on the sand ground below the scene. */
.problem__list { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(18px, 2.6vw, 34px); }
@media (min-width: 820px) { .problem__list { grid-template-columns: repeat(3, 1fr); } }
.problem__list li { padding: 22px 0 0; border-top: 1px solid var(--line-light); }
.problem__num {
  display: block; font-family: var(--font-serif); font-size: 14px;
  color: var(--stone); letter-spacing: 0.1em; margin-bottom: 12px;
}
.problem__list p { font-size: 15.5px; color: var(--stone); }
.problem__list strong { display: block; color: var(--ink); font-weight: 600; font-size: 16px; margin-bottom: 5px; }

/* ============================================================================
   10. ABOUT — a major moment: extra height, content offset off the left margin,
   the paragraph lifted into a large frosted card.
   ========================================================================== */
.about { --pad: clamp(108px, 15vw, 216px); }
.about__inner { display: grid; gap: clamp(28px, 4vw, 52px); }
@media (min-width: 980px) {
  /* Offset: nothing starts at the same left margin as the sections around it. */
  .about__inner { grid-template-columns: 0.34fr 0.66fr; padding-left: 8%; }
}
.about__card { padding: clamp(30px, 4.4vw, 58px); }
.about__quote {
  font-family: var(--font-serif);
  font-size: clamp(20px, 2.7vw, 31px); line-height: 1.45; letter-spacing: -0.005em;
  color: var(--sand);
}
.about__sig {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--stone-dim); margin-top: 30px;
  padding-top: 22px; border-top: 1px solid var(--line-dark);
}

/* ============================================================================
   11. HOW IT WORKS — staggered cards, not a symmetrical grid
   ========================================================================== */
.how { --pad: clamp(84px, 11vw, 150px); }
/* THE PINNED MOMENT — the only one on the page, kept singular on purpose.
   On desktop the heading column holds in place while both track cards travel up
   past it, then releases with the section. The tracks stack vertically here
   rather than sitting side by side: a two-across pair is barely taller than the
   heading itself, so there would be nothing for the sticky element to hold
   through. The stack is what buys the hold. */
.how__layout { display: grid; gap: clamp(30px, 4vw, 54px); }
@media (min-width: 900px) {
  /* Heading column kept deliberately narrow: the tracks now carry a horizontal
     three-step process and need the width more than the headline does. */
  .how__layout { grid-template-columns: 0.32fr 0.68fr; gap: clamp(34px, 4vw, 66px); align-items: start; }
  /* 116px clears the 68px nav with breathing room above the label. */
  .how__pin { position: sticky; top: 116px; }
}
.tracks { display: grid; gap: clamp(22px, 3vw, 38px); margin-top: clamp(30px, 4vw, 44px); }
@media (min-width: 900px) {
  .tracks { margin-top: 0; }
  /* Second card stepped right — keeps the editorial asymmetry the old
     side-by-side vertical stagger used to provide. */
  .tracks > :nth-child(2) { margin-left: clamp(0px, 3.5vw, 52px); }
}
.track { padding: clamp(30px, 3.8vw, 46px); display: flex; flex-direction: column; }
.track__tag {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--stone); margin-bottom: 16px;
}
.track__price {
  font-family: var(--font-serif); font-size: 15px; color: var(--stone);
  padding-bottom: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--line-light);
}
/* Horizontal connected process — circular badges joined by a hairline, one row
   per track. Structural idea from the architecture reference, drawn in this
   page's own stone/sand tokens rather than its gold. Stacks on narrow screens,
   where a connected row simply will not fit. */
.track__steps {
  list-style: none; margin: 0; padding: 0; flex: 1;
  position: relative; display: grid; gap: 22px;
}
.step { position: relative; z-index: 1; }
.step__badge {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line-light);
  /* Opaque so it visibly breaks the connector line running behind it. */
  background: var(--sand-2);
  font-family: var(--font-serif); font-size: 12.5px; color: var(--stone);
  letter-spacing: 0.06em;
}
.step__text { font-size: 15px; line-height: 1.55; }

/* 1020px, not a smaller breakpoint: below this the steps sit inside a nested
   column and three across would leave each one a ~130px ribbon of text. The
   connected row only earns its place once the columns can actually breathe. */
@media (min-width: 1020px) {
  .track__steps { grid-template-columns: repeat(3, 1fr); gap: clamp(14px, 1.6vw, 24px); }
  /* Runs between the first and last badge centres — with three equal columns
     those sit at 1/6 and 5/6 of the row. */
  .track__steps::before {
    content: ""; position: absolute; z-index: 0;
    top: 17px; left: 16.666%; right: 16.666%;
    height: 1px; background: var(--line-light);
  }
  .step__badge { margin-bottom: 16px; }
}
@media (max-width: 1019px) {
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 15px; align-items: start; }
}
.track__cta { margin-top: 30px; }

/* ============================================================================
   12. WHY OAHU — a major moment: text left, detail image right, extra height
   ========================================================================== */
.why { --pad: clamp(100px, 13.5vw, 196px); }
.why__grid { display: grid; gap: clamp(34px, 5vw, 70px); align-items: center; }
@media (min-width: 940px) { .why__grid { grid-template-columns: 1.06fr 0.94fr; } }
.why__points { display: grid; margin-top: 40px; }
.why__point { padding: 24px 0; border-bottom: 1px solid var(--line-dark); }
.why__point:first-child { border-top: 1px solid var(--line-dark); }
.why__point h3 { font-size: 19px; color: var(--sand); margin-bottom: 7px; }
.why__point p { font-size: 15px; color: var(--stone-dim); }
.why__slot { aspect-ratio: 4 / 3; }
@media (min-width: 940px) { .why__media { transform: translateY(18px); } }

/* Real vendor categories, surfaced before the form. Same array the waitlist
   select is built from — nothing invented, nothing counted. */
.why__cats {
  margin-top: clamp(46px, 6vw, 76px);
  padding-top: clamp(32px, 4vw, 46px);
  border-top: 1px solid var(--line-dark);
}
.why__cats-note { font-size: 15px; margin: -8px 0 22px; }
.cats { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 9px; }
.cat {
  font-size: 12.5px; letter-spacing: 0.03em;
  color: rgba(237, 229, 216, 0.80);
  border: 1px solid var(--line-dark);
  background: rgba(237, 229, 216, 0.045);
  padding: 9px 15px; border-radius: 2px;
  transition: border-color 280ms var(--ease), background 280ms var(--ease), color 280ms var(--ease);
}
@media (hover: hover) and (pointer: fine) {
  .cat:hover {
    color: var(--sand);
    border-color: rgba(201, 164, 101, 0.48);
    background: rgba(201, 164, 101, 0.09);
  }
}

/* ============================================================================
   12b. FEATURED VIDEO PLAYER — the page's one "watch this" moment.
   Everything else that moves is ambient and autoplaying; this one starts
   paused behind a play affordance and carries visible transport UI so it
   reads as something you choose to watch.
   ========================================================================== */
.vp__cue {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  background: rgba(6, 13, 19, 0.30);
  border: 0; padding: 0; cursor: pointer;
  transition: opacity 340ms var(--ease), background 340ms var(--ease);
}
.slot--player.is-playing .vp__cue { opacity: 0; pointer-events: none; }
.vp__cue-mark {
  position: relative; display: block;
  width: 64px; height: 64px; border-radius: 50%;
  border: 1px solid rgba(237, 229, 216, 0.55);
  background: rgba(11, 22, 32, 0.42);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: transform 340ms var(--ease), border-color 340ms var(--ease), background 340ms var(--ease);
}
.vp__cue-mark::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  transform: translate(-40%, -50%);
  border-left: 15px solid var(--sand);
  border-top: 9.5px solid transparent; border-bottom: 9.5px solid transparent;
}
.vp__cue:hover .vp__cue-mark {
  transform: scale(1.06); border-color: var(--brass-2); background: rgba(11, 22, 32, 0.58);
}

.vp {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  display: flex; align-items: center; gap: 13px;
  padding: 30px clamp(14px, 2.2vw, 22px) 13px;
  background: linear-gradient(to top, rgba(6, 13, 19, 0.88), rgba(6, 13, 19, 0));
}
.vp__btn {
  flex: none; position: relative; width: 32px; height: 32px; padding: 0;
  border-radius: 50%; cursor: pointer;
  border: 1px solid rgba(237, 229, 216, 0.30);
  background: rgba(11, 22, 32, 0.45);
  transition: border-color 260ms var(--ease), background 260ms var(--ease);
}
.vp__btn:hover { border-color: var(--brass-2); background: rgba(11, 22, 32, 0.68); }
.vp__icon { position: absolute; top: 50%; left: 50%; width: 10px; height: 11px; transform: translate(-50%, -50%); }
/* Play triangle, swapped for two pause bars once running. */
.vp__icon::before {
  content: ""; position: absolute; top: 0; left: 1px;
  border-left: 9px solid var(--sand);
  border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent;
  transition: opacity 160ms var(--ease);
}
.vp__icon::after {
  content: ""; position: absolute; top: 0; left: 0; width: 10px; height: 11px;
  border-left: 3px solid var(--sand); border-right: 3px solid var(--sand);
  opacity: 0; transition: opacity 160ms var(--ease);
}
.slot--player.is-playing .vp__icon::before { opacity: 0; }
.slot--player.is-playing .vp__icon::after  { opacity: 1; }

.vp__track {
  flex: 1; height: 2px; border-radius: 2px; overflow: hidden;
  background: rgba(237, 229, 216, 0.20);
}
.vp__fill { display: block; height: 100%; width: 0%; background: var(--brass-2); }
.vp__time {
  flex: none; font-size: 11px; letter-spacing: 0.07em;
  color: rgba(237, 229, 216, 0.72);
  font-variant-numeric: tabular-nums;
}

/* ============================================================================
   13. FOUNDER NOTE — a minor moment on purpose: less height, narrow measure,
   offset right of center. Modest, not a polished bio block.
   ========================================================================== */
.founder { --pad: clamp(64px, 8vw, 108px); }
.founder__inner { max-width: 640px; }
@media (min-width: 900px) { .founder__inner { position: relative; margin-left: 34%; } }

/* A person arriving alongside their words — quiet, not a hero-sized visual.
   Mobile: sits in normal flow, first child, centered, modest. Desktop: pulled
   out of flow into the 34% gutter .founder__inner already reserved and never
   used. `right: 100%` anchors it to founder__inner's own left edge rather
   than computing the gutter's width, so it stays correct at any viewport
   without duplicating the 34% figure here. */
.founder__photo {
  display: block; width: 190px; aspect-ratio: 4 / 5;
  margin: 0 auto 28px; object-fit: cover;
  border-radius: 3px;
  border: 1px solid rgba(169, 131, 75, 0.34); /* --brass at low opacity */
  box-shadow: var(--shadow-card);
  /* Desaturates the photo's natural greenery just enough that it sits inside
     the navy/sand/gold palette instead of fighting it — not a heavy filter
     stack, this is still meant to read as an unretouched photo of a person. */
  filter: saturate(0.82) sepia(0.07) contrast(1.02);
}
@media (min-width: 900px) {
  .founder__photo {
    position: absolute; top: 6px; right: 100%; margin: 0 32px 0 0;
    width: 200px;
  }
}
.founder__note {
  font-family: var(--font-serif); font-size: clamp(18px, 2vw, 22px);
  line-height: 1.62; color: var(--ink);
}
.founder__note p + p { margin-top: 18px; }
.founder__sign {
  display: flex; align-items: center; gap: 14px; margin-top: 30px;
  font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--stone);
}
.founder__sign::before { content: ""; width: 34px; height: 1px; background: var(--stone); opacity: 0.5; }

/* ============================================================================
   14. WAITLIST — form floats on a light glass card over full-bleed photography
   ========================================================================== */
.waitlist { --pad: clamp(96px, 12vw, 172px); overflow: hidden; }
/* Full-bleed background layer for the waitlist image slot, held at low opacity
   so the frosted form card floats over photography rather than flat color.
   (Slot marker lives in the JS component — CSS comments can't nest.) */
.waitlist__slot { position: absolute; inset: 0; z-index: 0; border-radius: 0; box-shadow: none; opacity: 0.42; }
.waitlist__slot .slot__frame { display: none; }
.waitlist__slot .slot__meta { left: auto; right: var(--gutter); top: 20px; bottom: auto; }
.waitlist__scrim {
  position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(70% 60% at 20% 20%, rgba(7, 15, 22, 0.72) 0%, rgba(7, 15, 22, 0.9) 70%),
    linear-gradient(180deg, rgba(7, 15, 22, 0.9), rgba(7, 15, 22, 0.82));
}
.waitlist > .wrap { z-index: 2; }
.waitlist__head { max-width: 46ch; }
@media (min-width: 900px) {
  .waitlist__grid { display: grid; grid-template-columns: 0.78fr 1.22fr; gap: clamp(40px, 6vw, 84px); align-items: center; }
}
.waitlist__head .lede { color: rgba(237, 229, 216, 0.72); }
.form-shell { padding: clamp(26px, 3.6vw, 46px); }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line-light); margin-bottom: 32px; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer;
  font-family: var(--font-sans); font-size: 12px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--stone); padding: 14px 18px; margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  transition: color 250ms ease, border-color 250ms ease;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }

.field { margin-bottom: 20px; }
.field label {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--stone); margin-bottom: 9px;
}
.field input, .field select {
  width: 100%; font-family: var(--font-sans); font-size: 16px; color: var(--ink);
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid var(--line-light); border-radius: 2px; padding: 14px 15px;
  transition: border-color 220ms ease, background 220ms ease, box-shadow 220ms ease;
}
.field input:focus, .field select:focus {
  background: #fff; border-color: var(--brass);
  box-shadow: 0 0 0 3px rgba(169, 131, 75, 0.13);
}
.field input::placeholder { color: #B2ABA0; }
.field.has-error input, .field.has-error select { border-color: #9E3B2E; }
.field__error { display: none; font-size: 13px; color: #9E3B2E; margin-top: 7px; }
.field.has-error .field__error { display: block; }
.form__fine { font-size: 13px; color: var(--stone); margin-top: 18px; line-height: 1.55; }

.confirm { display: none; padding: 8px 0 4px; }
.confirm.is-visible { display: block; }
.confirm__mark {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid var(--brass); color: var(--brass);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; margin-bottom: 22px;
}
.confirm h3 { font-size: 26px; margin-bottom: 12px; }
.confirm p { color: var(--stone); font-size: 16px; max-width: 46ch; }
.confirm__again {
  appearance: none; background: none; border: 0; padding: 0; margin-top: 22px;
  font-family: var(--font-sans); font-size: 13px; letter-spacing: 0.06em;
  color: var(--brass); text-decoration: underline; text-underline-offset: 4px; cursor: pointer;
}
.pane[hidden] { display: none; }
/* Tab crossfade. Deliberately quick — this is a utility switch, not a moment.
   Out is faster than in (150 vs 200ms) so the incoming pane never appears to
   wait on the outgoing one. */
.pane {
  transition: opacity var(--t-quick) var(--ease), transform var(--t-quick) var(--ease);
}
.pane.is-swapping-out { opacity: 0; transform: translateY(-6px); transition-duration: 150ms; }
.pane.is-swapping-in  { opacity: 0; transform: translateY(8px);  transition-duration: 0ms; }

/* Confirmation entrance — the one place on the page where a small reward is
   warranted. The check, heading and body rise in sequence. `is-revealed` is
   added a frame after `is-visible` (see initForms): a transition cannot run on
   an element in the same frame it leaves display:none. */
.confirm__mark, .confirm h3, .confirm p, .confirm__again {
  opacity: 0; transform: translateY(9px);
  transition: opacity var(--t-base) var(--ease), transform var(--t-base) var(--ease);
}
.confirm.is-revealed .confirm__mark,
.confirm.is-revealed h3,
.confirm.is-revealed p,
.confirm.is-revealed .confirm__again { opacity: 1; transform: none; }
.confirm.is-revealed .confirm__mark  { transition-delay:  40ms; }
.confirm.is-revealed h3              { transition-delay: 110ms; }
.confirm.is-revealed p               { transition-delay: 180ms; }
.confirm.is-revealed .confirm__again { transition-delay: 250ms; }
/* Web3Forms honeypot — visually hidden via CSS (not the hidden attribute) so

/* ============================================================================
   16. CROSS-DISSOLVE
   Two observers. The IN observer fades a section up as it arrives. The OUT
   observer fades the previous section down while it is STILL on screen, so the
   two overlap — a genuine dissolve rather than a hard cut. ~520ms.
   ========================================================================== */
.js .reveal {
  opacity: 0; transform: translateY(22px); filter: blur(6px);
  transition: opacity var(--t-slow) var(--ease),
              transform var(--t-slow) var(--ease),
              filter var(--t-slow) var(--ease);
  will-change: opacity, transform;
}
.js .reveal.is-in { opacity: 1; transform: none; filter: blur(0); }
/* Outgoing section, still partly visible, dissolving under the incoming one. */
.js .reveal.is-in.is-out { opacity: 0.22; transform: translateY(-14px); }

/* Per-element cascade. Each piece inside a section carries its own entrance and
   fires ~80ms behind the one before it, so a section arrives as a sequence
   rather than a single block. Delays hang off `.is-in` only — the outgoing
   dissolve must not be staggered. */
.js .reveal [data-delay] {
  opacity: 0; transform: translateY(16px); filter: blur(4px);
  transition: opacity 560ms var(--ease),
              transform 560ms var(--ease),
              filter 560ms var(--ease);
}
.js .reveal.is-in [data-delay] { opacity: 1; transform: none; filter: blur(0); }
.js .reveal.is-in [data-delay="1"] { transition-delay:  80ms; }
.js .reveal.is-in [data-delay="2"] { transition-delay: 160ms; }
.js .reveal.is-in [data-delay="3"] { transition-delay: 240ms; }
.js .reveal.is-in [data-delay="4"] { transition-delay: 320ms; }

/* List-item cascade — one level finer than the block cascade above. Only the
   three genuinely enumerable lists on the page get this; body copy and static
   labels stay still on purpose. No blur here: these are small elements and the
   extra raster cost is not worth it for 9px of travel.
   Delays start at 380ms so the items begin arriving while their parent block is
   still resolving — overlapping reads as continuous, sequential reads as slow. */
.js .reveal .problem__list li,
.js .reveal .why__point,
.js .reveal .track__steps li {
  opacity: 0; transform: translateY(9px);
  transition: opacity var(--t-base) var(--ease),
              transform var(--t-base) var(--ease);
}
.js .reveal.is-in .problem__list li,
.js .reveal.is-in .why__point,
.js .reveal.is-in .track__steps li { opacity: 1; transform: none; }

.js .reveal.is-in .problem__list li:nth-child(1),
.js .reveal.is-in .why__point:nth-child(1),
.js .reveal.is-in .track__steps li:nth-child(1) { transition-delay: 380ms; }
.js .reveal.is-in .problem__list li:nth-child(2),
.js .reveal.is-in .why__point:nth-child(2),
.js .reveal.is-in .track__steps li:nth-child(2) { transition-delay: 450ms; }
.js .reveal.is-in .problem__list li:nth-child(3),
.js .reveal.is-in .why__point:nth-child(3),
.js .reveal.is-in .track__steps li:nth-child(3) { transition-delay: 520ms; }
.js .reveal.is-in .problem__list li:nth-child(4),
.js .reveal.is-in .why__point:nth-child(4),
.js .reveal.is-in .track__steps li:nth-child(4) { transition-delay: 590ms; }
.js .reveal.is-in .problem__list li:nth-child(n+5),
.js .reveal.is-in .why__point:nth-child(n+5),
.js .reveal.is-in .track__steps li:nth-child(n+5) { transition-delay: 660ms; }

/* ---------------------------------------------------------------------------
   HERO ENTRANCE — deliberately unlike the rest of the page.
   Everywhere else a section arrives in ~560ms on an 80ms ladder. The hero is
   the one moment worth slowing down for, so it runs its own longer sequence:
   the backdrop settles first (JS, see initParallax), then the headline
   resolves out of a real blur, then the supporting copy follows it in.
   These rules carry `.hero` in the selector, which outranks the generic
   `.reveal.is-in [data-delay]` ladder above without needing !important.
   ------------------------------------------------------------------------- */

/* The headline carries no data-delay, so it needs its own hidden state.
   14px of blur and 34px of travel over 1250ms — roughly double the page's
   standard entrance, which is what makes it read as considered rather than
   just late. */
.js .hero.reveal .hero__title {
  opacity: 0; transform: translateY(34px); filter: blur(14px);
  transition: opacity 1250ms var(--ease),
              transform 1250ms var(--ease),
              filter 1250ms var(--ease);
  transition-delay: 420ms;
  will-change: transform, filter, opacity;
}
.js .hero.reveal.is-in .hero__title { opacity: 1; transform: none; filter: blur(0); }

/* Supporting copy waits for the headline to be most of the way resolved
   before it starts, so the hero reads as backdrop -> headline -> everything
   else rather than as one simultaneous block. */
.js .hero.reveal.is-in [data-delay="1"] { transition-delay: 240ms; }
.js .hero.reveal.is-in [data-delay="3"] { transition-delay: 1080ms; }
.js .hero.reveal.is-in [data-delay="4"] { transition-delay: 1240ms; }
/* The cue is last in and fades rather than travels — it is an instruction,
   not part of the composition. */
.js .hero.reveal .scroll-cue { opacity: 0; transition: opacity 700ms var(--ease); }
.js .hero.reveal.is-in .scroll-cue { opacity: 1; transition-delay: 1560ms; }

/* ---------------------------------------------------------------------------
   FOUNDER PHOTO ENTRANCE — a person arriving, then their words.
   Scale-settle rather than blur: this is a "minor moment" section by design
   (see the FOUNDER NOTE header comment), so it borrows the slot__media
   parallax's quiet 1.04 -> 1.0 settle rather than the hero's heavier blur
   treatment — enough to feel considered without competing with the hero for
   weight. No data-delay attribute, so — same as .hero__title — it needs its
   own hidden state; transition-delay 0 puts it essentially alongside the
   label's 80ms, arriving a beat first rather than simultaneously.
   ------------------------------------------------------------------------- */
.js .founder.reveal .founder__photo {
  opacity: 0; transform: scale(1.04);
  transition: opacity 640ms var(--ease), transform 640ms var(--ease);
  transition-delay: 0ms;
  will-change: transform, opacity;
}
.js .founder.reveal.is-in .founder__photo { opacity: 1; transform: none; }

/* Phones rasterize a blurred full-width section at real cost, so the entrance
   blur is lighter there. It is the one property in this file that is not free.
   Must come after the rules above — same specificity, so source order decides. */
@media (max-width: 700px) {
  .js .reveal { filter: blur(3.5px); }
  .js .reveal [data-delay] { filter: blur(2.5px); }
  .js .reveal.is-in, .js .reveal.is-in [data-delay] { filter: blur(0); }
  /* The hero headline's 14px blur is the single most expensive raster on the
     page. On a phone it spans most of the viewport width, so it comes down to
     7px — still clearly a focus-pull, at roughly a quarter of the fill cost. */
  .js .hero.reveal .hero__title { filter: blur(7px); }
  .js .hero.reveal.is-in .hero__title { filter: blur(0); }
}

/* Once the entrance is done the filter is dropped entirely (see initReveal).
   A lingering blur(0) is still a filter: it keeps the section on its own raster
   layer for the rest of the page's life, which is exactly the cost we do not
   want to carry on a phone while scrolling. */
.js .reveal.is-clear,
.js .reveal.is-clear [data-delay],
/* The headline sits outside the [data-delay] group, so it needs naming here
   explicitly or it would hold a blur(0) raster layer for the life of the page
   — the exact cost this cleanup exists to avoid. */
.js .reveal.is-clear .hero__title { filter: none; will-change: auto; }
/* The founder photo has no filter to drop, but it does carry its own
   will-change outside the [data-delay] group above — same cleanup, different
   property. */
.js .reveal.is-clear .founder__photo { will-change: auto; }

  html { scroll-behavior: auto; }
  .js .reveal,
  .js .reveal [data-delay],

     headline and cue are outside the [data-delay] group and would otherwise
     stay at opacity 0 forever, blanking the hero for exactly the users this
     block exists to protect. */
  .js .hero.reveal .hero__title,
  .js .hero.reveal .scroll-cue {
    opacity: 1 !important; transform: none !important;
    filter: none !important; transition: none !important;
  }
  /* Not folded into the rule above: that one also zeroes `filter`, and the
     founder photo's filter is the permanent saturate/sepia colour grade
     (Part 2), not an entrance effect — clearing it here would strip that
     treatment for exactly the users this block is meant to protect, not
     touch. Only the animated properties get forced. */
  .js .founder.reveal .founder__photo {
    opacity: 1 !important; transform: none !important; transition: none !important;
  }
  .js .reveal.is-out { opacity: 1 !important; }
  .tracks > :nth-child(2) { transform: none !important; }
  /* No pinning and no cursor glow either — both are motion. */
  .how__pin { position: static !important; }
  .glass::after, .glass-light::after { content: none !important; }
  .track:hover { transform: none !important; }

  /* Everything added for the extended coverage pass. The catch-all at the
     bottom of this block zeroes durations, but it does NOT reset the resting
     states these effects animate *from* — an element left at opacity 0 would
     simply never be seen. Each one is reset to its final state explicitly. */
  .js .reveal .problem__list li,
  .js .reveal .why__point,
  .js .reveal .track__steps li,
  .confirm__mark, .confirm h3, .confirm p, .confirm__again,
  .pane, .pane.is-swapping-out, .pane.is-swapping-in {
    opacity: 1 !important; transform: none !important; transition: none !important;
  }
  /* An infinite animation clamped to 0.001ms is still an infinite animation. */
  .scroll-cue { animation: none !important; opacity: 1 !important; }
  /* Underline still appears on hover — it is an affordance, not motion — but
     it arrives instantly rather than drawing. */
  .nav__links a::after { transition: none !important; }
  .btn--brass::after { display: none !important; }

  /* Structural pass additions. The featured player itself still works — an
     explicit click to play is a user choice, not imposed motion — but nothing
     around it slides or scales. */
  .scene__more:hover span { transform: none !important; }
  .vp__cue:hover .vp__cue-mark { transform: none !important; }
  .vp__cue, .vp__cue-mark, .vp__btn, .vp__icon::before, .vp__icon::after, .cat {
    transition: none !important;
  }
  /* No parallax, no scale-settle, no drift headroom — the visual sits still.
     Video src is never attached either (see initMedia), so what shows is the
     static poster image. */
  .slot__media {
    top: 0 !important; height: 100% !important;
    transform: none !important; opacity: 1 !important; will-change: auto !important;
  }
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

  /* ==========================================================================
     ImageSlot — renders a composed placeholder, or the real asset once a
     filename is set in CONFIG. Aspect ratio and position are already correct,
     so dropping the image in changes nothing about the layout.
     ====================================================================== */
  function ImageSlot(name, opts) {
    opts = opts || {};
    var img = pickArt("images", name) || "";
    var vid = (CONFIG.videos ? pickArt("videos", name) : "") || "";
    var cls = ["slot"];
    if (opts.tone === "light") cls.push("slot--light");
    if (opts.className) cls.push(opts.className);
    if (img || vid) cls.push("is-filled");

    /* Video slots render the still as the poster so the frame is filled the
       instant the page paints — no flash of empty space. The clip itself is
       NOT in the src: initMedia() attaches it only when the slot nears the
       viewport, and never at all under prefers-reduced-motion, in which case
       the poster simply stays put as a static image.
       muted + playsinline are required for mobile autoplay; none have sound. */
    var media = "";
    var label = opts.alt
      ? ' role="img" aria-label="' + esc(opts.alt) + '"'
      : ' aria-hidden="true"';

    /* opts.player turns a slot into the page's one FEATURED video: it does not
       autoplay, it is not driven by initMedia, and it carries its own controls.
       Starting paused behind a play button is what makes it read as "watch
       this" rather than as another ambient loop. */
    if (vid && opts.player) {
      cls.push("slot--player");
      media = '<video class="slot__media" muted loop playsinline preload="none"' +
              (img ? ' poster="' + esc(img) + '"' : '') +
              ' data-src="' + esc(vid) + '" data-player="1"' + label + '></video>';
    } else if (vid) {
      media = '<video class="slot__media" autoplay muted loop playsinline preload="none"' +
              (img ? ' poster="' + esc(img) + '"' : '') +
              ' data-src="' + esc(vid) + '"' +
              (opts.eager ? ' data-eager="1"' : '') + label + '></video>';
    } else if (img) {
      media = '<img class="slot__media" src="' + esc(img) + '" alt="' + esc(opts.alt || "") + '"' +
              (opts.eager ? '' : ' loading="lazy"') + ' />';
    }

    var controls = "";
    if (vid && opts.player) {
      controls = '' +
        '<button class="vp__cue" type="button" data-vp-toggle aria-label="Play video">' +
          '<span class="vp__cue-mark" aria-hidden="true"></span>' +
        '</button>' +
        '<div class="vp">' +
          '<button class="vp__btn" type="button" data-vp-toggle aria-label="Play video">' +
            '<span class="vp__icon" data-vp-icon aria-hidden="true"></span>' +
          '</button>' +
          // Non-interactive on purpose: the brief calls for a subtle progress
          // indicator, and a real scrubber would need slider semantics and
          // keyboard handling for a four-second clip.
          '<div class="vp__track" role="progressbar" aria-label="Video progress"' +
            ' aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-vp-track>' +
            '<span class="vp__fill" data-vp-fill></span>' +
          '</div>' +
          '<span class="vp__time" data-vp-time>0:00 / 0:00</span>' +
        '</div>';
    }

    return '' +
      '<figure class="' + cls.join(" ") + '" data-slot="' + esc(name) + '"' +
        (opts.style ? ' style="' + opts.style + '"' : '') + '>' +
        media +
        '<div class="slot__frame"></div>' +
        controls +
        '<figcaption class="slot__meta"><b>Image slot</b>' + esc(name) +
          (opts.hint ? '<br>' + esc(opts.hint) : '') + '</figcaption>' +
      '</figure>';
  }

  /* Single source of truth for the motion preference, used by every effect. */
  function prefersReduced() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  /* --------------------------------------------------------------------------
     VIDEO LOADING — lazy, and paused when off screen.
     Nothing below the fold fetches a clip on initial load; each one is attached
     as it approaches the viewport and paused again once it leaves, so four
     autoplaying videos never compete for bandwidth or battery at once.
     -------------------------------------------------------------------- */
  function initMedia() {
    // The featured player is deliberately excluded: it is user-driven, so it
    // must not be autoplayed here, nor have its source stripped under reduced
    // motion — an explicit click to play is a choice, not imposed motion.
    var vids = $$("video.slot__media:not([data-player])");
    if (!vids.length) { console.log("[Valley Network] no ambient video slots wired"); return; }

    /* pickArt() runs once at render so the poster is correct before first
       paint. That leaves one gap: a phone rotated into landscape keeps the
       portrait asset and crops it hard vertically. Re-resolve when the media
       query flips. Registered on both the reduced-motion and full paths — a
       reduced-motion user is looking at the poster and nothing else, so
       getting its orientation right matters more there, not less.
       Safe to swap here: something is already painted, so no blank frame. */
    function watchArtDirection(swapVideo) {
      if (!CONFIG.portrait || !window.matchMedia) return;
      var mq = window.matchMedia(CONFIG.portrait.media);
      var onFlip = function () {
        $$(".slot[data-slot]").forEach(function (slot) {
          var key = slot.getAttribute("data-slot");
          if (!CONFIG.portrait.videos[key] && !CONFIG.portrait.images[key]) return;
          var v = slot.querySelector("video.slot__media");
          if (!v) return;
          var nextImg = pickArt("images", key);
          if (nextImg) {
            v.setAttribute("poster", nextImg);
            // If the clip already failed, the still is being held as a CSS
            // background — repoint that too or the swap would be invisible.
            if (v.dataset.fellBack) v.style.backgroundImage = 'url("' + nextImg + '")';
          }
          if (!swapVideo) return;
          var nextVid = pickArt("videos", key);
          if (nextVid && v.dataset.src !== nextVid) {
            v.dataset.src = nextVid;
            if (v.dataset.loaded) { v.src = nextVid; v.load(); v.play().catch(function () {}); }
          }
        });
      };
      if (mq.addEventListener) mq.addEventListener("change", onFlip);
      else if (mq.addListener) mq.addListener(onFlip);
    }

    if (prefersReduced()) {
      // Never fetch the clip at all — the poster frame is the final image.
      vids.forEach(function (v) { v.removeAttribute("autoplay"); v.removeAttribute("data-src"); });
      watchArtDirection(false);   // poster only; there is no clip to swap
      console.log("[Valley Network] reduced motion: showing", vids.length, "static posters");
      return;
    }

    /* A <video> that fails to load stops painting its poster — the element
       goes transparent and the slot behind it shows through empty. For the
       hero that means a blank first screen on any 404, codec refusal or
       blocked request, which is the one failure the poster exists to prevent.
       Painting the still as a CSS background keeps it visible in that state.
       Done on the same element rather than swapping in an <img> so the
       parallax loop keeps its node reference. */
    function posterFallback(v) {
      var poster = v.getAttribute("poster");
      if (!poster || v.dataset.fellBack) return;
      v.dataset.fellBack = "1";
      v.style.backgroundImage = 'url("' + poster + '")';
      v.style.backgroundSize = "cover";
      v.style.backgroundPosition = getComputedStyle(v).objectPosition || "center";
      v.style.backgroundRepeat = "no-repeat";
      console.warn("[Valley Network] clip failed, holding poster:", v.dataset.src || v.src);
    }

    function activate(v) {
      try {
        if (!v.dataset.loaded) {
          v.dataset.loaded = "1";
          v.addEventListener("error", function () { posterFallback(v); });
          v.src = v.dataset.src;
          v.load();
        }
        var p = v.play();
        // Autoplay can still be refused (iOS low-power, data saver). The poster
        // stays visible, so a refusal degrades to exactly the static design.
        if (p && p.catch) {
          p.catch(function (err) {
            console.warn("[Valley Network] autoplay refused:", v.dataset.src, err && err.name);
          });
        }
      } catch (err) {
        console.error("[Valley Network] video activate failed:", err);
      }
    }

    if (!("IntersectionObserver" in window)) { vids.forEach(activate); return; }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) activate(entry.target);
        else if (entry.target.dataset.loaded) entry.target.pause();
      });
    }, { rootMargin: "300px 0px" });  // begin loading just before it scrolls in

    vids.forEach(function (v) {
      // Everything is observed so it pauses once off screen — including the
      // hero, which would otherwise keep decoding while you read the footer.
      io.observe(v);
      if (v.dataset.eager) activate(v);   // hero also starts immediately
    });
    console.log("[Valley Network] video: 1 eager,", vids.length - 1, "lazy");
    watchArtDirection(true);   // poster and clip
  }

  /* --------------------------------------------------------------------------
     SCROLL-LINKED MOTION — parallax drift + settle-in.
     Runs off one rAF-throttled scroll listener (never raw scroll), touches only
     transform and opacity so it stays on the compositor, and skips any slot
     that is off screen. Layers on top of the section cross-dissolve: a section
     is still fading up while its visual is already drifting and settling, so
     the page reads as continuous motion rather than fade-pause-fade.
     -------------------------------------------------------------------- */
  function initParallax() {
    if (prefersReduced() || !window.requestAnimationFrame) {
      console.log("[Valley Network] scroll-linked motion disabled (reduced motion)");
      return;
    }
    // Featured player excluded — drifting and scale-settling a clip while
    // someone is deliberately watching it works against the whole point of it.
    var media = $$(".slot__media:not([data-player])");
    if (!media.length) return;

    var ticking = false;
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

    /* The hero is the one section allowed to exceed the page's motion budget.
       Everything else drifts 7.5% and settles 1.045 -> 1.0; the hero drifts
       12% and covers 1.10 -> 1.0 -> 1.045. The restraint rule still holds for
       the other eight sections — this is a deliberate single exception, not a
       loosening of the standard. */
    var HERO_DRIFT = 0.09;   // vs 0.075 elsewhere. Fits the 10% CSS headroom.
    var HERO_INTRO = 1.07;   // load-time settle start, vs 1.045 elsewhere
    var HERO_EXIT  = 0.045;  // extra scale picked up as the hero leaves
    var INTRO_MS   = 1800;

    var heroMedia = document.querySelector(".hero__slot .slot__media");
    /* Why the hero needs its own intro term at all: the shared `enter` factor
       is driven by how far a slot has travelled up the viewport. The hero
       starts at the top of the document, so at load `enter` is already 1 and
       the shared scale-settle is over before it begins — the hero has never
       actually played one. This drives it from elapsed time instead. */
    var heroIntro = heroMedia ? 0 : 1;

    function update() {
      ticking = false;
      var vh = window.innerHeight;

      media.forEach(function (el) {
        var slot = el.parentElement;
        var r = slot.getBoundingClientRect();
        // Cheap bail-out: nothing to compute for slots nowhere near the screen.
        if (r.bottom < -200 || r.top > vh + 200) return;

        var isHero = (el === heroMedia);

        // How far this slot has travelled through the viewport: 0 as its top
        // edge touches the bottom, 1 once its bottom edge clears the top.
        var p = clamp((vh - r.top) / (vh + r.height), 0, 1);

        // Drift against the scroll, bounded by the headroom the CSS reserves
        // — roughly 15% of scroll speed, so it reads as depth, not detachment.
        var drift = (0.5 - p) * 2 * (r.height * (isHero ? HERO_DRIFT : 0.075));

        var scale, opacity;
        if (isHero) {
          // Settle in from the timed intro, then pick scale back up on the way
          // out so scrolling away from the hero has depth of its own.
          var intro = HERO_INTRO - (HERO_INTRO - 1) * easeOut(heroIntro);
          var exit  = easeOut(clamp(-r.top / vh, 0, 1));
          scale = intro * (1 + HERO_EXIT * exit);
          // Never fades: it is the first thing on screen and must be at full
          // strength immediately.
          opacity = 1;
        } else {
          // Settle: eases from 1.045 down to 1.0 and fades up as the slot arrives.
          var enter = easeOut(clamp((vh - r.top) / (vh * 0.62), 0, 1));
          scale = 1.045 - 0.045 * enter;
          opacity = 0.55 + 0.45 * enter;
        }

        el.style.transform = "translate3d(0," + drift.toFixed(2) + "px,0) scale(" + scale.toFixed(4) + ")";
        el.style.opacity = opacity.toFixed(3);
      });
    }

    // Drives the hero's load-time settle. Runs for INTRO_MS and then stops —
    // after that the hero is scroll-driven like everything else.
    if (heroMedia) {
      var introStart = null;
      (function introTick(ts) {
        if (introStart === null) introStart = ts || 0;
        heroIntro = clamp(((ts || 0) - introStart) / INTRO_MS, 0, 1);
        update();
        if (heroIntro < 1) window.requestAnimationFrame(introTick);
      })(0);
    }

    function onScroll() {
      if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    window.addEventListener("orientationchange", onScroll, { passive: true });
    update();   // set the opening frame so nothing pops on first paint
    console.log("[Valley Network] scroll-linked motion on", media.length, "visuals");
  }

  /* --------------------------------------------------------------------------
     CROSS-DISSOLVE — two IntersectionObservers.
     IN: fade + lift the arriving section (520ms).
     OUT: fade the departing section down WHILE it is still on screen, so the
          two overlap. The out-observer watches only the top band of the
          viewport; a section is "out" once it has cleared that band but is
          still partly visible — which is what makes it read as a dissolve
          rather than a cut.
     -------------------------------------------------------------------- */
  function initReveal() {
    var reduced = prefersReduced();
    var targets = $$(".reveal");

    if (reduced || !("IntersectionObserver" in window)) {
      // is-clear too, so no section is left carrying a filter it never needed.
      targets.forEach(function (el) { el.classList.add("is-in", "is-clear"); });
      console.log("[Valley Network] dissolve disabled (reduced motion or no IO support)");
      return;
    }

    /* Longest possible entrance: the last child delay (320ms) plus its own
       560ms transition, rounded up. After that the blur has no work left to do
       and `is-clear` drops the filter entirely — see the CSS note. */
    var CLEAR_AFTER = 950;

    function markIn(el) {
      el.classList.add("is-in");
      window.setTimeout(function () { el.classList.add("is-clear"); }, CLEAR_AFTER);
    }

    var inIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          markIn(entry.target);
          inIO.unobserve(entry.target); // one-way; never flickers back out
        }
      });
    }, { threshold: 0.10, rootMargin: "0px 0px -8% 0px" });

    var outIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var pastTop = entry.boundingClientRect.top < 0;
        entry.target.classList.toggle("is-out", !entry.isIntersecting && pastTop);
      });
    }, { threshold: 0, rootMargin: "0px 0px -82% 0px" });

    targets.forEach(function (el) {
      inIO.observe(el);
      if (!el.hasAttribute("data-no-dissolve-out")) outIO.observe(el);
    });
    console.log("[Valley Network] cross-dissolve active on", targets.length, "sections");

    /* Safety net. IntersectionObserver is suspended while a tab is hidden, so a
       page opened in a background tab (or restored from a session) can sit at
       opacity 0 with no callback to wake it. Reveal anything already in view
       that the observer hasn't handled — the dissolve still runs normally for
       everything below the fold. */
    function rescueVisible(reason) {
      var rescued = 0;
      targets.forEach(function (el) {
        if (el.classList.contains("is-in")) return;
        var r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) { markIn(el); rescued++; }
      });
      if (rescued) console.log("[Valley Network] revealed", rescued, "section(s) via safety net:", reason);
    }
    setTimeout(function () { rescueVisible("timeout"); }, 1800);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) rescueVisible("tab became visible");
    });
  }

  /* --------------------------------------------------------------------------
     CURSOR-REACTIVE CARD GLOW — pointer position feeds two custom properties
     the CSS radial gradient reads. Gated three ways: reduced motion, a real
     hover-capable fine pointer (never touch, where a "hover" glow would latch
     on after a tap), and the form shell is skipped so nothing chases the cursor
     across the inputs. Writes are rAF-throttled and touch only custom
     properties, so a pointermove never triggers layout.
     -------------------------------------------------------------------- */
  function initCardGlow() {
    if (prefersReduced()) { console.log("[Valley Network] card glow off (reduced motion)"); return; }
    if (!window.matchMedia || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      console.log("[Valley Network] card glow off (no fine pointer)");
      return;
    }

    var cards = $$(".glass, .glass-light").filter(function (card) {
      return !card.classList.contains("form-shell");
    });

    cards.forEach(function (card) {
      var queued = false, x = 0, y = 0;
      card.addEventListener("pointermove", function (e) {
        var r = card.getBoundingClientRect();
        x = e.clientX - r.left;
        y = e.clientY - r.top;
        if (queued) return;
        queued = true;
        window.requestAnimationFrame(function () {
          queued = false;
          card.style.setProperty("--mx", x.toFixed(1) + "px");
          card.style.setProperty("--my", y.toFixed(1) + "px");
        });
      }, { passive: true });
    });
    console.log("[Valley Network] card glow active on", cards.length, "cards");
  }

  /* --------------------------------------------------------------------------
     FEATURED VIDEO PLAYER — the one "watch this" moment on the page.
     Starts paused on its poster; the source is only fetched on the first play,
     so this costs nothing until someone asks for it. Deliberately minimal:
     play/pause, a progress indicator, and elapsed / duration.
     -------------------------------------------------------------------- */
  function initVideoPlayer() {
    var players = $$("video[data-player]");
    if (!players.length) return;

    function fmt(t) {
      if (!isFinite(t) || t < 0) t = 0;
      var m = Math.floor(t / 60), s = Math.floor(t % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    players.forEach(function (v) {
      var fig    = v.closest(".slot");
      var toggles = $$("[data-vp-toggle]", fig);
      var fill   = $("[data-vp-fill]", fig);
      var track  = $("[data-vp-track]", fig);
      var time   = $("[data-vp-time]", fig);
      if (!toggles.length) return;

      function syncLabels() {
        var playing = !v.paused && !v.ended;
        fig.classList.toggle("is-playing", playing);
        toggles.forEach(function (b) {
          b.setAttribute("aria-label", playing ? "Pause video" : "Play video");
        });
      }

      function tick() {
        var d = v.duration;
        var pct = (isFinite(d) && d > 0) ? (v.currentTime / d) * 100 : 0;
        if (fill) fill.style.width = pct.toFixed(2) + "%";
        if (track) track.setAttribute("aria-valuenow", Math.round(pct));
        if (time) time.textContent = fmt(v.currentTime) + " / " + fmt(isFinite(d) ? d : 0);
      }

      function toggle() {
        try {
          if (v.paused) {
            // Source attaches on first play only — nothing is fetched before this.
            if (!v.dataset.loaded) {
              v.dataset.loaded = "1";
              v.src = v.dataset.src;
              v.load();
            }
            var p = v.play();
            if (p && p.catch) {
              p.catch(function (err) {
                console.warn("[Valley Network] featured video play refused:", err && err.name);
                syncLabels();
              });
            }
          } else {
            v.pause();
          }
        } catch (err) {
          console.error("[Valley Network] featured video toggle failed:", err);
        }
      }

      toggles.forEach(function (b) { b.addEventListener("click", toggle); });
      ["play", "pause", "ended"].forEach(function (evt) {
        v.addEventListener(evt, function () { syncLabels(); tick(); });
      });
      v.addEventListener("timeupdate", tick);
      v.addEventListener("loadedmetadata", tick);

      // Pause when it scrolls away — no point decoding a clip nobody can see.
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          entries.forEach(function (e) { if (!e.isIntersecting && !v.paused) v.pause(); });
        }, { threshold: 0 }).observe(v);
      }

      syncLabels();
      tick();
    });
    console.log("[Valley Network] featured video player ready on", players.length, "slot(s)");
  }

  function initNav() {
    var nav = $("#nav");
    if (!nav) return;
    var onScroll = function () { nav.classList.toggle("is-scrolled", window.scrollY > 40); };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  /* --------------------------------------------------------------------------
     Waitlist tabs — click + arrow keys, standard ARIA tab pattern.
     -------------------------------------------------------------------- */
  var KINDS = ["agent", "vendor"];

  var SWAP_OUT = 150;     // matches .pane.is-swapping-out
  var tabSwapTimer = null;
  var currentTab = null;

  /* Crossfade between panes. ARIA state flips immediately — assistive tech must
     never wait on an animation — while only the visual swap is deferred.
     `immediate` covers the first call and reduced motion, where the pane is
     switched in one frame with no transition at all. */
  function selectTab(kind, immediate) {
    if (KINDS.indexOf(kind) === -1) return;
    if (kind === currentTab) return;

    var previous = currentTab;
    currentTab = kind;

    KINDS.forEach(function (k) {
      var tab = $("#tab-" + k);
      if (!tab) return;
      tab.setAttribute("aria-selected", k === kind ? "true" : "false");
      tab.tabIndex = k === kind ? 0 : -1;
    });

    var incoming = $("#pane-" + kind);
    var outgoing = previous ? $("#pane-" + previous) : null;
    if (!incoming) return;

    if (tabSwapTimer) { window.clearTimeout(tabSwapTimer); tabSwapTimer = null; }

    function show() {
      KINDS.forEach(function (k) {
        var pane = $("#pane-" + k);
        if (pane) { pane.hidden = k !== kind; pane.classList.remove("is-swapping-out"); }
      });
    }

    if (immediate || prefersReduced() || !outgoing) {
      show();
      console.log("[Valley Network] waitlist tab →", kind, immediate ? "(no transition)" : "");
      return;
    }

    outgoing.classList.add("is-swapping-out");
    tabSwapTimer = window.setTimeout(function () {
      tabSwapTimer = null;
      show();
      // Start the incoming pane offset, then release it on the next frame so
      // the browser has a previous style to interpolate from.
      incoming.classList.add("is-swapping-in");
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () {
          incoming.classList.remove("is-swapping-in");
        });
      });
    }, SWAP_OUT);

    console.log("[Valley Network] waitlist tab →", kind);
  }

  function initTabs() {
    $$(".tab").forEach(function (tab) {
      tab.addEventListener("click", function () { selectTab(tab.dataset.tab); });
      tab.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        var next = tab.dataset.tab === "agent" ? "vendor" : "agent";
        selectTab(next);
        var el = $("#tab-" + next);
        if (el) el.focus();
      });
    });
    $$("[data-open-tab]").forEach(function (link) {
      link.addEventListener("click", function () { selectTab(link.getAttribute("data-open-tab")); });
    });
    selectTab("agent", true);   // first paint: no crossfade
  }

  /* --------------------------------------------------------------------------
     Validation + submit. Client-side only; entries are kept in localStorage
     so nothing is silently lost before a backend exists.
     -------------------------------------------------------------------- */
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;

  function setError(form, name, message) {
    var field = form.querySelector('[data-field="' + name + '"]');
    if (!field) return;
    field.classList.toggle("has-error", Boolean(message));
    var err = field.querySelector(".field__error");
    if (err) err.textContent = message || "";
    var input = field.querySelector("input, select");
    if (input) input.setAttribute("aria-invalid", message ? "true" : "false");
  }

  function validate(form, kind) {
    var data = {
      name: (form.elements.name.value || "").trim(),
      email: (form.elements.email.value || "").trim()
    };
    if (kind === "vendor") data.category = form.elements.category.value || "";

    var errors = {};
    if (data.name.length < 2) errors.name = "Please enter your name.";
    if (!EMAIL_RE.test(data.email)) errors.email = "Please enter a valid email address.";
    if (kind === "vendor" && !data.category) errors.category = "Please pick your business type.";

    ["name", "email", "category"].forEach(function (f) { setError(form, f, errors[f]); });
    return { data: data, errors: errors, ok: Object.keys(errors).length === 0 };
  }

  function save(kind, data) {
    try {
      var key = "vn_waitlist";
      var all = JSON.parse(localStorage.getItem(key) || "[]");
      all.push({ kind: kind, data: data, at: new Date().toISOString() });
      localStorage.setItem(key, JSON.stringify(all));
      console.log("[Valley Network] saved locally. total entries:", all.length);
    } catch (err) {
      console.warn("[Valley Network] local save unavailable:", err && err.message);
    }
  }

  function initForms() {
    KINDS.forEach(function (kind) {
      var form = $("#form-" + kind), confirm = $("#confirm-" + kind);
      if (!form || !confirm) {
        console.error("[Valley Network] missing form or confirmation for:", kind);
        return;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        try {
          var result = validate(form, kind);
          if (!result.ok) {
            console.log("[Valley Network] validation failed:", result.errors);
            var firstBad = form.querySelector(".has-error input, .has-error select");
            if (firstBad) firstBad.focus();
            return;
          }
          console.log("[Valley Network] submit ok:", kind, result.data);
          // Backup copy — kept even though the real destination is the email
          // below, so nothing is lost if the network request ever fails.
          save(kind, result.data);

          var payload = {
            access_key: CONFIG.web3formsKey,
            subject: kind === "agent"
              ? "New Agent Waitlist Signup — Valley Network"
              : "New Vendor Waitlist Signup — Valley Network",
            name: result.data.name,
            email: result.data.email,
            botcheck: form.elements.botcheck ? form.elements.botcheck.value : ""
          };
          if (kind === "vendor") payload.category = result.data.category;

          fetch("https://api.web3forms.com/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(payload)
          })
            .then(function (res) { return res.json(); })
            .then(function (json) {
              if (!json || !json.success) throw new Error((json && json.message) || "Web3Forms submission failed");
              form.style.display = "none";
              confirm.classList.add("is-visible");
              confirm.setAttribute("tabindex", "-1");
              confirm.focus();
              // One frame later, so the children have a computed style to
              // transition *from* — a transition cannot start in the same frame
              // the element leaves display:none.
              window.requestAnimationFrame(function () {
                window.requestAnimationFrame(function () {
                  confirm.classList.add("is-revealed");
                });
              });
            })
            .catch(function (err) {
              console.error("[Valley Network] Web3Forms submit failed:", err);
              alert("Something went wrong submitting that. Please email " + CONFIG.contactEmail + " and we'll add you manually.");
            });
        } catch (err) {
          console.error("[Valley Network] submit failed:", err);
          alert("Something went wrong submitting that. Please email " + CONFIG.contactEmail + " and we'll add you manually.");
        }
      });

      $$("input, select", form).forEach(function (input) {
        input.addEventListener("input", function () { setError(form, input.name, ""); });
      });

      var again = confirm.querySelector('[data-reset="' + kind + '"]');
      if (again) {
        again.addEventListener("click", function () {
          form.reset();
          ["name", "email", "category"].forEach(function (f) { setError(form, f, ""); });
          confirm.classList.remove("is-visible", "is-revealed");
          form.style.display = "";
          var first = form.querySelector("input");
          if (first) first.focus();
          console.log("[Valley Network] form reset:", kind);
        });
      }
    });
  }

  function init() {
    try {
      render();
      initNav();
      initMedia();
      initParallax();
      initReveal();
      initVideoPlayer();
      initCardGlow();
      initTabs();
      initForms();
      console.log("[Valley Network] ready");
    } catch (err) {
      console.error("[Valley Network] init failed:", err);
      // Never leave a blank page behind a JS error.
      document.documentElement.classList.remove("js");
      $$(".reveal").forEach(function (el) { el.classList.add("is-in"); });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
